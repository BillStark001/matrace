[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrace"
version = "0.1.0"
description = "MATLAB-to-Python interpreter and compiler"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "miss_hit_core",
    "torch",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "torchdiffeq",
    "build",
]

[tool.setuptools.packages.find]
exclude = ["tests*"]
